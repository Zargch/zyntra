# Compila Zyntra (x64 y x86), arma el instalador y las versiones portables.
# - En cada push y a mano (Actions > Build > Run workflow): deja todo como artefacto del run.
# - Al subir una etiqueta vX.Y.Z: crea un borrador de Release con los archivos.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: pwsh
        run: |
          $v = (Select-String -Path src/version.h -Pattern 'ZYNTRA_VERSION_STR "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($tag -ne $v) { throw "La etiqueta v$tag no coincide con src/version.h ($v)" }
          }
          "ZYNTRA_VERSION=$v" | Out-File -Append $env:GITHUB_ENV

      - name: Compilar x64 y x86
        shell: cmd
        run: build.bat all

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Armar instalador
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\zyntra.iss'

      - name: Versiones portables y sumas SHA-256
        shell: pwsh
        run: |
          foreach ($a in 'x64', 'x86') {
            $d = "dist\Zyntra-$env:ZYNTRA_VERSION-portable-$a"
            New-Item -ItemType Directory -Force $d | Out-Null
            Copy-Item "bin\$a\Zyntra.exe", assets\intro.mov $d
            Copy-Item LICENSE "$d\LICENSE.txt"
            Copy-Item docs\TERMINOS.txt, docs\PRIVACIDAD.txt $d
            Compress-Archive -Path "$d\*" -DestinationPath "$d.zip" -Force
            Remove-Item -Recurse $d
          }
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Zyntra-${{ env.ZYNTRA_VERSION }}
          path: dist/*

      - name: Borrador de Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist -File).FullName --draft --title "Zyntra $env:ZYNTRA_VERSION" --notes-file CHANGELOG.md
